[package]
name = "meili"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Gmail from the terminal: k9s-style TUI and bulk command mode"
license = "MIT"
repository = "https://github.com/sonirico/meili"
readme = "README.md"
keywords = ["gmail", "email", "tui", "cli"]
categories = ["command-line-utilities", "email"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures = "0.3.34"
google-gmail1 = "7.0.0"
mail-builder = "2.0.1"
mail-parser = "1.0.1"
mime = "0.3.18"
open = "5.4.5"
ratatui = "0.30.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
